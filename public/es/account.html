<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu cuenta · Advisor Team</title>
<meta name="description" content="Tu cuenta de Advisor Team.">
<meta property="og:title" content="Tu cuenta · Advisor Team"><meta property="og:description" content="Tu cuenta de Advisor Team."><meta property="og:image" content="/img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">

<link rel="alternate" hreflang="en" href="/account"><link rel="alternate" hreflang="nl" href="/nl/account"><link rel="alternate" hreflang="es" href="/es/account">
</head>
<body>
<header class="pagehead" style="background-image:url(/img/hero.jpg);min-height:52vh"><div class="inner"><p class="kicker">Cuenta</p><h1 id="hi">Tu cuenta</h1></div></header><section class="block"><div class="wrap split"><div><p class="lead" id="who">Cargando…</p><a class="btn gold" href="/es/pricing">Pedir un Snapshot</a> <button class="btn" id="out">Cerrar sesión</button></div><div class="cell" style="border:1px solid var(--line)"><h3>Próximos pasos</h3><p>1. Pide tu Snapshot en la página de precios.</p><p>2. Responde al correo de confirmación con tus datos.</p><p>3. Recibe tu informe y reserva un Zoom si quieres.</p></div></div></section>
<script src="/assets/app.js"></script>
<script>fetch("/api/me").then(r=>r.json()).then(d=>{if(!d.user){location.href="/es/login";return}document.getElementById("hi").textContent="Hola, "+d.user.name;document.getElementById("who").textContent="Sesión iniciada como "+d.user.email+(d.user.company?" · "+d.user.company:"")});document.getElementById("out").onclick=()=>fetch("/api/logout",{method:"POST"}).then(()=>location.href="/es/")</script>
</body>
</html>
