<div class="formwrap"><div class="art" style="background-image:url(/img/orbits.jpg)"></div><div class="side"><form id="f" novalidate><p class="kicker">Advisor Team</p><h2>Crea tu cuenta</h2><label for="name">Nombre</label><input id="name" name="name" type="text" autocomplete="name" required><label for="company">Empresa</label><input id="company" name="company" type="text" autocomplete="organization"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Contraseña (mínimo 8 caracteres)</label><input id="password" name="password" type="password" autocomplete="new-password" required><button class="btn gold" type="submit">Crear cuenta</button><div class="msg" role="status"></div><p class="small">¿Ya tienes una cuenta? <a href="/es/login">Iniciar sesión</a></p></form></div></div>
