<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Je account · Advisor Team</title>
<meta name="description" content="Je Advisor Team-account.">
<meta property="og:title" content="Je account · Advisor Team"><meta property="og:description" content="Je Advisor Team-account."><meta property="og:image" content="/img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" hreflang="en" href="/account"><link rel="alternate" hreflang="nl" href="/nl/account">
</head>
<body>
<header class="pagehead" style="background-image:url(/img/hero.jpg);min-height:52vh"><div class="inner"><p class="kicker">Account</p><h1 id="hi">Je account</h1></div></header><section class="block"><div class="wrap split"><div><p class="lead" id="who">Laden…</p><a class="btn gold" href="/nl/pricing">Bestel een Snapshot</a> <button class="btn" id="out">Uitloggen</button></div><div class="cell" style="border:1px solid var(--line)"><h3>Volgende stappen</h3><p>1. Bestel je Snapshot op de prijspagina.</p><p>2. Antwoord op de bevestigingsmail met je data.</p><p>3. Ontvang je rapport en plan een Zoom-gesprek als je dat wilt.</p></div></div></section>
<script src="/assets/app.js"></script>
<script>fetch("/api/me").then(r=>r.json()).then(d=>{if(!d.user){location.href="/nl/login";return}document.getElementById("hi").textContent="Hallo, "+d.user.name;document.getElementById("who").textContent="Ingelogd als "+d.user.email+(d.user.company?" · "+d.user.company:"")});document.getElementById("out").onclick=()=>fetch("/api/logout",{method:"POST"}).then(()=>location.href="/nl/")</script>
</body>
</html>
