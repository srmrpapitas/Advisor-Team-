<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account · Advisor Team</title>
<meta name="description" content="Your Advisor Team account.">
<meta property="og:title" content="Your account · Advisor Team"><meta property="og:description" content="Your Advisor Team account."><meta property="og:image" content="/img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="pagehead" style="background-image:url(/img/hero.jpg);min-height:52vh"><div class="inner"><p class="kicker">Account</p><h1 id="hi">Your account</h1></div></header><section class="block"><div class="wrap split"><div><p class="lead" id="who">Loading…</p><a class="btn gold" href="/pricing">Order a Snapshot</a> <button class="btn" id="out">Log out</button></div><div class="cell" style="border:1px solid var(--line)"><h3>Next steps</h3><p>1. Order your Snapshot on the pricing page.</p><p>2. Reply to the confirmation email with your data.</p><p>3. Receive your report, then book a Zoom if you want one.</p></div></div></section>
<script src="/assets/app.js"></script>
<script>fetch("/api/me").then(r=>r.json()).then(d=>{if(!d.user){location.href="/login";return}document.getElementById("hi").textContent="Hello, "+d.user.name;document.getElementById("who").textContent="Signed in as "+d.user.email+(d.user.company?" · "+d.user.company:"")});document.getElementById("out").onclick=()=>fetch("/api/logout",{method:"POST"}).then(()=>location.href="/")</script>
</body>
</html>
